name: devices

# The sample app's tests on real devices: sample-app/tests/Simulator, driving the
# plugin in this checkout. The unit suite in tests.yml fakes the machine; this does not.
#
# Android runs on every pull request that touches the plugin or the sample app: a Linux
# runner with KVM boots the emulator, and its minutes are cheap. iOS needs a macOS runner,
# whose minutes cost ten times as much, so it runs when started by hand and once a week.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'sample-app/**'
      - 'composer.json'
      - '.github/workflows/devices.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Which devices to run
        type: choice
        options: [both, android, ios]
        default: both
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: devices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Emulator
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: sample-app
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: exif, gd, sodium, sqlite3, pdo_sqlite, zip
          ini-values: memory_limit=2G
          coverage: none

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner user cannot open /dev/kvm until this udev rule runs. KVM is what lets
      # the emulator boot inside the plugin's 300 second limit.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator platforms;android-36 build-tools;36.0.0 system-images;android-36;google_apis;x86_64'

      # A pixel_7 image asks for a 12 GB userdata partition. The emulator will not go
      # below 7.2 GiB, and exits when the runner has less free.
      - name: Create the emulator
        run: |
          echo no | avdmanager create avd --force --name Pixel --package 'system-images;android-36;google_apis;x86_64' --device pixel_7
          config="${HOME}/.android/avd/Pixel.avd/config.ini"
          sed -i '/^disk.dataPartition.size=/d' "$config"
          echo 'disk.dataPartition.size=2048M' >> "$config"

      - name: Install the sample app
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      # nativephp/ is not committed. The first screen() runs native:run, which needs it.
      - name: Install the Android project
        run: php artisan native:install android --no-interaction

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/share/boost /usr/local/share/vcpkg /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/.ghcup /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/ndk-bundle
          docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Run the device tests
        run: stdbuf -oL -eL php vendor/bin/pest tests/Simulator --android

      - name: Upload what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-failures
          if-no-files-found: ignore
          path: |
            sample-app/simulator-failures/
            sample-app/emulator*.log

  ios:
    name: iOS Simulator
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.platform != 'android')
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: sample-app
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: exif, gd, sodium, sqlite3, pdo_sqlite, zip
          ini-values: memory_limit=2G
          coverage: none

      - name: Install idb_companion
        run: brew install idb-companion

      - name: Install the sample app
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Install the iOS project
        run: php artisan native:install ios --no-interaction

      # No --device: the plugin takes the newest iPhone the runner's Xcode has.
      - name: Run the device tests
        run: php vendor/bin/pest tests/Simulator --ios

      - name: Upload what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-failures
          if-no-files-found: ignore
          path: |
            sample-app/simulator-failures/
            sample-app/companion*.log
