name: devices

# The sample app's tests on real devices: sample-app/tests/Simulator, driving the
# plugin in this checkout. The unit suite in tests.yml fakes the machine; this does not.
#
# Android runs on every pull request that touches the plugin or the sample app: a Linux
# runner with KVM boots the emulator, and its minutes are cheap. iOS needs a macOS runner,
# whose minutes cost ten times as much, so it runs when started by hand and once a week.
#
# Android also runs on main after a merge. A pull request can only read caches that main
# saved, so that is what fills the Gradle cache for the next pull request.
#
# Both jobs run the tests with --simulator-verbose. The slowest commands and steps go on
# the run's summary page, and the whole log is uploaded as the job's timings artifact.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'sample-app/**'
      - 'composer.json'
      - 'actions/**'
      - '.github/workflows/devices.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'sample-app/**'
      - 'composer.json'
      - 'actions/**'
      - '.github/workflows/devices.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Which devices to run
        type: choice
        options: [both, android, ios]
        default: both
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: devices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Emulator
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: sample-app
    steps:
      - uses: actions/checkout@v4

      # The sample app's own setup, as a user's job does it before the action. Composer
      # needs PHP 8.4 or newer for this app. The action then sets up the PHP that
      # sample-app/nativephp.lock names, 8.5 too, and checks it.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite
          coverage: none

      - name: Install the sample app
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      # Everything else is actions/android, the action this repository gives users, so
      # this job tests it.
      - uses: ./actions/android
        with:
          app-directory: sample-app
          tests: tests/Simulator

  ios:
    name: iOS Simulator
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.platform != 'android')
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: sample-app
    steps:
      - uses: actions/checkout@v4

      # The sample app's own setup, as a user's job does it before the action. Composer
      # needs PHP 8.4 or newer for this app. The action then sets up the PHP that
      # sample-app/nativephp.lock names, 8.5 too, and checks it.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite
          coverage: none

      - name: Install the sample app
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      # Everything else is actions/ios, the action this repository gives users, so this
      # job tests it.
      - uses: ./actions/ios
        with:
          app-directory: sample-app
          tests: tests/Simulator
