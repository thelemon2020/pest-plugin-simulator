name: segfault-hunt

# Temporary, on the debug/php83-segfault branch only. The PHP 8.3 / Pest 4 unit run
# segfaults after its last test, in the Zend allocator under preg_match (Termwind or
# Symfony Console printing the summary): heap corruption from something earlier.
# - Round 1: the whole suite 5 times in 20 jobs; 13 crashed.
# - Round 2: each test file alone, 4 times; none crashed.
# This round runs the suite under valgrind, which reports a bad write where it happens,
# and the suite without one group of files at a time.
on:
  push:
    branches: [debug/php83-segfault]

permissions:
  contents: read

jobs:
  valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --with="pestphp/pest:^4.0" --with="phpunit/phpunit:^12.0" --with-all-dependencies

      - name: Install valgrind
        run: sudo apt-get install -y valgrind > /dev/null 2>&1 && valgrind --version

      # The system allocator, so valgrind sees each block. PCRE's JIT off, as it confuses
      # valgrind. Tests may fail from the slowdown; what counts is valgrind's report.
      - name: Run the suite under valgrind
        run: |
          set +e +o pipefail
          USE_ZEND_ALLOC=0 ZEND_DONT_UNLOAD_MODULES=1 valgrind --error-limit=no --num-callers=40 \
            --log-file=/tmp/valgrind.log php -d pcre.jit=0 vendor/bin/pest > /tmp/pest.log 2>&1
          echo "pest exit: $?"
          tail -5 /tmp/pest.log
          echo "invalid reads/writes: $(grep -cE 'Invalid (read|write)' /tmp/valgrind.log)"
          grep -E 'ERROR SUMMARY' /tmp/valgrind.log
          awk '/Invalid (read|write)/{n++} n>=1 && n<=4' /tmp/valgrind.log | head -250

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valgrind
          path: |
            /tmp/valgrind.log
            /tmp/pest.log

  without:
    name: Suite without group ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --with="pestphp/pest:^4.0" --with="phpunit/phpunit:^12.0" --with-all-dependencies

      - name: Run the suite without this group five times
        run: |
          set +e +o pipefail
          files=(tests/Unit/*.php)
          start=$(( ${{ matrix.group }} * 6 ))
          echo "left out: ${files[@]:$start:6}"
          keep=()
          for i in "${!files[@]}"; do
            if [ "$i" -lt "$start" ] || [ "$i" -ge $(( start + 6 )) ]; then keep+=("${files[$i]}"); fi
          done
          crashes=0
          for i in 1 2 3 4 5; do
            vendor/bin/pest "${keep[@]}" > /tmp/pest-$i.log 2>&1
            rc=$?
            echo "run $i: exit $rc"
            [ "$rc" -eq 139 ] && crashes=$(( crashes + 1 ))
            [ "$rc" -ne 0 ] && [ "$rc" -ne 139 ] && tail -5 /tmp/pest-$i.log
          done
          echo "crashes: $crashes of 5"
