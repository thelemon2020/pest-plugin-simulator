name: segfault-hunt

# Temporary, on the debug/php83-segfault branch only. The PHP 8.3 / Pest 4 unit run
# segfaults after its last test, in the Zend allocator under preg_match: heap corruption
# from something earlier. Round 1 ran the whole suite 5 times in 20 jobs, and 13 crashed.
# This round runs each test file on its own, four times, to find the file that corrupts
# the heap. A job fails only on a segfault, and prints the backtrace.
on:
  push:
    branches: [debug/php83-segfault]

permissions:
  contents: read

jobs:
  files:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "files=$(ls tests/Unit/*.php | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  hunt:
    name: ${{ matrix.file }}
    needs: files
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.files.outputs.files) }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --with="pestphp/pest:^4.0" --with="phpunit/phpunit:^12.0" --with-all-dependencies

      - name: Get ready to catch a crash
        run: |
          sudo apt-get install -y gdb > /dev/null 2>&1
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p

      - name: Run the file four times
        run: |
          set +e +o pipefail
          ulimit -c unlimited
          for i in 1 2 3 4; do
            vendor/bin/pest "${{ matrix.file }}" > /tmp/pest-$i.log 2>&1
            rc=$?
            echo "run $i: exit $rc"
            if [ "$rc" -eq 139 ]; then
              tail -8 /tmp/pest-$i.log
              core=$(ls -t /tmp/core.* 2>/dev/null | head -1)
              [ -n "$core" ] && gdb -batch -ex 'bt 30' "$(command -v php)" "$core" 2>&1 | grep -E '^#' | head -30
              exit 1
            fi
            if [ "$rc" -ne 0 ]; then
              tail -8 /tmp/pest-$i.log
            fi
          done
