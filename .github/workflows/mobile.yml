name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# Unit tests only. The suite fakes simctl, idb_companion, and adb.
jobs:
  tests:
    name: PHP ${{ matrix.php }} / Pest ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.4"
            name: "5"
            pest: "^5.0"
            phpunit: "^13.0"
          - php: "8.3"
            name: "4"
            pest: "^4.0"
            phpunit: "^12.0"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --with="pestphp/pest:${{ matrix.pest }}" --with="phpunit/phpunit:${{ matrix.phpunit }}" --with-all-dependencies

      - name: Run tests
        run: vendor/bin/pest
