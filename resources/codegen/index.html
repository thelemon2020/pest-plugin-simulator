<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record a test</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc;
    --accent: #2f6fde; --assert: #1f8a4c; --error: #c2412d; --code-bg: #1d1d1b; --code-ink: #f1f1ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --ink: #ececE6; --muted: #9a9a92; --line: #33332f;
      --accent: #6a9cf5; --assert: #4cc183; --error: #f07a63; --code-bg: #0d0d0c; --code-ink: #ececE6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  main { display: flex; gap: 24px; padding: 20px; min-height: 100vh; align-items: flex-start; }
  .device { position: relative; flex: none; line-height: 0; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 8px 30px rgb(0 0 0 / .12); }
  .device img { display: block; max-height: calc(100vh - 40px); max-width: 46vw; cursor: crosshair; user-select: none; }
  .device .box { position: absolute; pointer-events: none; border: 2px solid var(--accent); border-radius: 4px; background: color-mix(in srgb, var(--accent) 12%, transparent); display: none; }
  body.assert .device .box { border-color: var(--assert); background: color-mix(in srgb, var(--assert) 12%, transparent); }
  .device .tip { position: absolute; left: 8px; right: 8px; bottom: 8px; line-height: 1.3; padding: 6px 8px; border-radius: 6px; background: rgb(0 0 0 / .75); color: #fff; font: 12px ui-monospace, monospace; display: none; }
  .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  body.assert .seg button[aria-pressed="true"] { background: var(--assert); }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); min-width: 0; flex: 1; }
  label { color: var(--muted); font-size: 13px; }
  pre { margin: 0; padding: 14px 16px; border-radius: 10px; background: var(--code-bg); color: var(--code-ink); font: 13px/1.55 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; min-height: 120px; }
  .status { min-height: 1.45em; color: var(--muted); }
  .status.error { color: var(--error); }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  @media (max-width: 720px) {
    main { flex-direction: column; padding: 16px; }
    .device img { max-width: 100%; max-height: 70vh; }
  }
</style>
</head>
<body>
<main>
  <div class="device">
    <img id="screen" src="/screen.png" alt="The device's screen">
    <div class="box" id="box"></div>
    <div class="tip" id="tip"></div>
  </div>
  <div class="side">
    <h1>Record a test</h1>
    <div class="row">
      <div class="seg" role="group" aria-label="Mode">
        <button id="mode-tap" aria-pressed="true">Tap</button>
        <button id="mode-assert" aria-pressed="false">Assert</button>
      </div>
      <button data-press="scroll-down">Scroll down</button>
      <button data-press="scroll-up">Scroll up</button>
      <button data-press="back">Back</button>
      <button data-press="dismiss">Close sheet</button>
    </div>
    <p class="hint">Tap mode runs what you click on the device and records it. Assert mode records a check for what you click. Press A to switch.</p>
    <div class="row">
      <label for="text">Text for the next field</label>
      <input id="text" placeholder="Ada Lovelace" autocomplete="off">
    </div>
    <div class="status" id="status">Connecting…</div>
    <pre id="code"></pre>
    <div class="row">
      <button id="undo">Undo last line</button>
      <button id="copy">Copy</button>
    </div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const img = $('screen'), box = $('box'), tip = $('tip'), status = $('status'), code = $('code');
  let state = { viewport: [1, 1], elements: [], code: '' };
  let mode = 'tap';
  let busy = false;
  let hovering = false;

  function say(message, error = false) {
    status.textContent = message;
    status.classList.toggle('error', error);
  }

  async function call(method, path, body) {
    const response = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    return data;
  }

  async function refresh() {
    try {
      state = await call('GET', '/state');
      code.textContent = state.code;
      // The screen may have changed under a cursor that has not moved.
      outline();
      await new Promise((resolve) => {
        const next = new Image();
        next.onload = next.onerror = resolve;
        next.src = '/screen.png?t=' + Date.now();
        img.src = next.src;
      });
    } catch (error) {
      say(error.message, true);
    }
  }

  // The device's own units: points on iOS, pixels on Android.
  function toDevice(event) {
    const rect = img.getBoundingClientRect();
    return [
      (event.clientX - rect.left) / rect.width * state.viewport[0],
      (event.clientY - rect.top) / rect.height * state.viewport[1],
    ];
  }

  // The server picks the control, so the outline is the one a click records.
  function pick(x, y) {
    return call('POST', '/pick', { x, y, mode });
  }

  // The last point the cursor was at over the screen, or null once it left.
  let point = null;

  function hide() {
    box.style.display = tip.style.display = 'none';
  }

  function draw(element) {
    if (!element) return hide();
    if (element.frame) {
      const scale = img.clientWidth / state.viewport[0];
      Object.assign(box.style, {
        display: 'block',
        left: element.frame[0] * scale + 'px', top: element.frame[1] * scale + 'px',
        width: element.frame[2] * scale + 'px', height: element.frame[3] * scale + 'px',
      });
    } else {
      box.style.display = 'none';
    }
    tip.style.display = 'block';
    tip.textContent = `${element.role || 'Element'}: ${element.label || element.id || '(no label)'}` + (element.id && element.label ? `  [${element.id}]` : '');
  }

  // One pick at a time. A move while one is out is not dropped: the pick after it is for
  // where the cursor is now, so the outline never stays on a control it has left.
  async function outline() {
    if (hovering || busy || !point) return;
    hovering = true;
    try {
      let asked, element;
      do {
        asked = point;
        ({ element } = await pick(...asked));
      } while (point && point !== asked && !busy);
      if (point === asked) draw(element);
    } catch {
      hide();
    } finally {
      hovering = false;
    }
  }

  img.addEventListener('mousemove', (event) => {
    point = toDevice(event);
    outline();
  });
  img.addEventListener('mouseleave', () => { point = null; hide(); });

  async function act(path, body, doing) {
    if (busy) return;
    busy = true;
    // The step changes the screen, so the outline would be for one that is going away.
    hide();
    say(doing);
    try {
      const result = await call('POST', path, body);
      code.textContent = result.code;
      say(result.line ? 'Recorded ' + result.line : 'Done.');
    } catch (error) {
      say(error.message, true);
    } finally {
      busy = false;
      refresh();
    }
  }

  img.addEventListener('click', async (event) => {
    if (busy) return;
    const [x, y] = toDevice(event);
    let element, field;
    try {
      ({ element, field } = await pick(x, y));
    } catch (error) {
      say(error.message, true);
      return;
    }
    let text = null;
    if (field) {
      text = $('text').value || prompt(`Text to type into ${element.label || 'this field'}`);
      if (!text) return;
      $('text').value = '';
    }
    act('/click', { x, y, mode, text }, mode === 'tap' ? 'Running it on the device…' : 'Recording the check…');
  });

  document.querySelectorAll('[data-press]').forEach((button) => {
    button.addEventListener('click', () => act('/press', { button: button.dataset.press }, 'Running it on the device…'));
  });

  function setMode(next) {
    mode = next;
    document.body.classList.toggle('assert', mode === 'assert');
    $('mode-tap').setAttribute('aria-pressed', String(mode === 'tap'));
    $('mode-assert').setAttribute('aria-pressed', String(mode === 'assert'));
  }
  $('mode-tap').addEventListener('click', () => setMode('tap'));
  $('mode-assert').addEventListener('click', () => setMode('assert'));
  document.addEventListener('keydown', (event) => {
    if (event.key.toLowerCase() === 'a' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
      setMode(mode === 'tap' ? 'assert' : 'tap');
    }
  });

  $('undo').addEventListener('click', async () => {
    const result = await call('POST', '/undo');
    code.textContent = result.code;
    say('Removed the last line. The device stays as it is.');
  });
  $('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(code.textContent);
    } catch {
      // A browser that keeps the clipboard API from this page still copies a selection.
      const area = Object.assign(document.createElement('textarea'), { value: code.textContent });
      document.body.appendChild(area);
      area.select();
      const copied = document.execCommand('copy');
      area.remove();
      if (!copied) return say('The browser did not allow copying. Select the code and copy it.', true);
    }
    say('Copied. Paste it into a test inside mobile().');
  });

  // The app changes on its own too, so the picture follows it between clicks.
  async function follow() {
    if (!busy && document.visibilityState === 'visible') await refresh();
    setTimeout(follow, 1500);
  }
  refresh().then(() => say('Ready. Click the screen to record a step.'));
  setTimeout(follow, 1500);
</script>
</body>
</html>
